name: Production Deploy

# Production is released by pushing a v* tag. The same Checks workflow that
# gates pull requests gates the release, the exact bytes that passed those
# checks are the bytes that ship, and the deploy is not called successful until
# the live site serves the build it just published.
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        type: choice
        required: true
        default: rollback
        options:
          - rollback
      rollback_slot:
        description: Optional rollback target slot (blue or green)
        type: string
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "20"

permissions:
  contents: read

# Never interrupt production. A cancelled deploy can leave the web root halfway
# between two releases, so queued runs wait instead of cancelling the run ahead.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    if: github.event_name == 'push'
    uses: ./.github/workflows/checks.yml

  package:
    name: Package release
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build_id: ${{ steps.build.outputs.build_id }}
      artifact: ${{ steps.build.outputs.artifact }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"

          if [ "$PACKAGE_VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build release
        id: build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          npm run build

          # A build stamp the live site can be asked for after the deploy. This
          # is what turns "the upload finished" into "the release is serving".
          build_id="$RELEASE_TAG $GITHUB_SHA"
          printf '%s\n' "$build_id" > dist/build-id.txt

          {
            echo "build_id=$build_id"
            echo "artifact=production-dist-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify generated SEO files
        run: |
          set -euo pipefail

          test -f dist/sitemap.xml
          test -f dist/robots.txt
          grep -F "User-agent: *" dist/robots.txt
          grep -F "Allow: /" dist/robots.txt
          grep -F "Sitemap: https://www.elevatedthinking.co/sitemap.xml" dist/robots.txt
          grep -F "https://www.elevatedthinking.co/" dist/sitemap.xml

      - name: Upload production artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: dist
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  deploy:
    name: Deploy to production
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    environment:
      name: prod
      url: ${{ vars.PROD_SITE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download production artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist

      - name: Open Hostinger session
        uses: ./.github/actions/hostinger-session
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          remote-path: ${{ secrets.HOSTINGER_REMOTE_PATH }}
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}

      - name: Select blue/green slot
        run: |
          set -euo pipefail

          previous_slot="$(scripts/deploy/hostinger-slot.sh read)"
          if [ "$previous_slot" = "blue" ]; then
            target_slot="green"
          else
            target_slot="blue"
          fi

          echo "Currently active slot: $previous_slot"
          echo "Deploying this release to slot: $target_slot"

          {
            echo "PREVIOUS_SLOT=$previous_slot"
            echo "TARGET_SLOT=$target_slot"
          } >> "$GITHUB_ENV"

      - name: Upload release to the inactive slot
        run: |
          set -euo pipefail

          "$LFTP_RUN" <<EOF
          mkdir -p -f "$HOSTINGER_SLOTS_ROOT"
          mkdir -p -f "$HOSTINGER_SLOTS_ROOT/blue"
          mkdir -p -f "$HOSTINGER_SLOTS_ROOT/green"
          mirror --reverse --delete --verbose dist "$HOSTINGER_SLOTS_ROOT/$TARGET_SLOT"
          EOF

      - name: Verify the uploaded slot
        env:
          EXPECTED_BUILD_ID: ${{ needs.package.outputs.build_id }}
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          "$LFTP_RUN" <<EOF
          get -O "$tmp_dir" "$HOSTINGER_SLOTS_ROOT/$TARGET_SLOT/build-id.txt"
          EOF

          uploaded="$(tr -d '\r' < "$tmp_dir/build-id.txt" | head -n 1)"
          if [ "$uploaded" != "$EXPECTED_BUILD_ID" ]; then
            echo "::error::Slot $TARGET_SLOT holds '$uploaded' but this release is '$EXPECTED_BUILD_ID'."
            exit 1
          fi

          echo "Slot $TARGET_SLOT verified as $uploaded."

      - name: Promote the release to the live web root
        run: |
          set -euo pipefail
          echo "PROMOTION_STARTED=true" >> "$GITHUB_ENV"
          scripts/deploy/hostinger-promote.sh dist

      - name: Record the active slot
        run: scripts/deploy/hostinger-slot.sh write "$TARGET_SLOT"

      - name: Verify the live site serves this release
        env:
          EXPECTED_BUILD_ID: ${{ needs.package.outputs.build_id }}
          PROD_SITE_URL: ${{ vars.PROD_SITE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${PROD_SITE_URL:-}" ]; then
            echo "::warning::PROD_SITE_URL is not set, so the live site was not verified after deploying."
            exit 0
          fi

          url="${PROD_SITE_URL%/}/build-id.txt"

          for attempt in 1 2 3 4 5 6; do
            # --location so a future apex/www canonical redirect does not read as a
            # failed verification.
            served="$(curl -fsSL --max-time 20 "$url" 2>/dev/null | tr -d '\r' | head -n 1 || true)"

            if [ "$served" = "$EXPECTED_BUILD_ID" ]; then
              echo "Live site is serving $served."
              exit 0
            fi

            echo "Attempt $attempt: live site reports '${served:-<no response>}'."
            sleep 10
          done

          echo "::error::Live site never reported build '$EXPECTED_BUILD_ID'."
          exit 1

      # If anything after the promotion failed, put the previous release back
      # rather than leaving production on a half-verified deploy.
      - name: Roll back to the previous slot
        if: failure() && env.PROMOTION_STARTED == 'true'
        run: |
          set -euo pipefail

          echo "::warning::Deployment failed after promotion; restoring slot $PREVIOUS_SLOT."

          rollback_dir="$RUNNER_TEMP/rollback"
          scripts/deploy/hostinger-slot.sh fetch "$PREVIOUS_SLOT" "$rollback_dir"
          scripts/deploy/hostinger-promote.sh "$rollback_dir"
          scripts/deploy/hostinger-slot.sh write "$PREVIOUS_SLOT"

          echo "::error::Production was rolled back to slot $PREVIOUS_SLOT."

      - name: Publish deployment summary
        if: ${{ !cancelled() }}
        env:
          BUILD_ID: ${{ needs.package.outputs.build_id }}
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Build: \`$BUILD_ID\`"
            echo "- Previous slot: \`${PREVIOUS_SLOT:-unknown}\`"
            echo "- Target slot: \`${TARGET_SLOT:-unknown}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create GitHub release for deployed tag
        uses: actions/github-script@v9.0.0
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

              core.info(`Release ${tag} already exists. Skipping creation.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              generate_release_notes: true,
              make_latest: 'true',
            });

  rollback:
    name: Roll back production
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    environment:
      name: prod
      url: ${{ vars.PROD_SITE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Open Hostinger session
        uses: ./.github/actions/hostinger-session
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          remote-path: ${{ secrets.HOSTINGER_REMOTE_PATH }}
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}

      - name: Resolve rollback slot
        env:
          ROLLBACK_SLOT_INPUT: ${{ inputs.rollback_slot }}
        run: |
          set -euo pipefail

          active_slot="$(scripts/deploy/hostinger-slot.sh read)"
          requested="$(printf '%s' "$ROLLBACK_SLOT_INPUT" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"

          if [ -n "$requested" ]; then
            if [ "$requested" != "blue" ] && [ "$requested" != "green" ]; then
              echo "::error::rollback_slot must be blue or green when provided."
              exit 1
            fi
            rollback_slot="$requested"
          elif [ "$active_slot" = "blue" ]; then
            rollback_slot="green"
          else
            rollback_slot="blue"
          fi

          echo "Active slot: $active_slot"
          echo "Rollback target slot: $rollback_slot"
          echo "ROLLBACK_SLOT=$rollback_slot" >> "$GITHUB_ENV"

      - name: Restore the rollback slot
        run: |
          set -euo pipefail

          rollback_dir="$RUNNER_TEMP/rollback"
          scripts/deploy/hostinger-slot.sh fetch "$ROLLBACK_SLOT" "$rollback_dir"
          scripts/deploy/hostinger-promote.sh "$rollback_dir"
          scripts/deploy/hostinger-slot.sh write "$ROLLBACK_SLOT"

      - name: Verify the live site after rollback
        env:
          PROD_SITE_URL: ${{ vars.PROD_SITE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${PROD_SITE_URL:-}" ]; then
            echo "::warning::PROD_SITE_URL is not set, so the live site was not verified after rolling back."
            exit 0
          fi

          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 20 -o /dev/null "${PROD_SITE_URL%/}/"; then
              echo "Live site responded after rolling back to $ROLLBACK_SLOT."
              exit 0
            fi
            echo "Attempt $attempt: live site did not respond."
            sleep 10
          done

          echo "::error::Live site did not respond after rolling back to $ROLLBACK_SLOT."
          exit 1
